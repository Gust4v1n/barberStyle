name: Construir APK Android (Capacitor)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Gerar APK de Depuracao (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Testar regras da agenda
        run: npm test
      - name: Gerar bundle web
        run: npm run build
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Preparar projeto nativo Android
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
      - name: Gerar imagens Android
        run: npm run assets:android
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Permitir execucao do Gradle
        run: chmod +x android/gradlew
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
